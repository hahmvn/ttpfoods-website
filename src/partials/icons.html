{# Line icons for the 8 product groups (24×24 grid, stroke = currentColor). #}
{% macro group_icon(key, size=56) %}
<svg class="gicon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if key == 'milka' %}
  {# tin of condensed cream #}
  <ellipse cx="12" cy="5.5" rx="6.5" ry="2"/><path d="M5.5 5.5v13c0 1.1 2.9 2 6.5 2s6.5-.9 6.5-2v-13"/><path d="M5.5 9.5c0 1.1 2.9 2 6.5 2s6.5-.9 6.5-2M5.5 15c0 1.1 2.9 2 6.5 2s6.5-.9 6.5-2"/><path d="M10 13.2h4"/>
{% elif key == 'gelatin' %}
  {# gelatin sheet + granules #}
  <path d="M4 7.5l8-3.5 8 3.5-8 3.5z"/><path d="M4 7.5v6l8 3.5 8-3.5v-6"/><path d="M12 11v6"/><circle cx="6" cy="20" r=".7"/><circle cx="9" cy="21" r=".7"/><circle cx="15" cy="21" r=".7"/><circle cx="18" cy="20" r=".7"/>
{% elif key == 'filling' %}
  {# bun with filling #}
  <path d="M3.5 13.5c0-4.4 3.8-7.5 8.5-7.5s8.5 3.1 8.5 7.5"/><path d="M3 13.5h18v2a3 3 0 01-3 3H6a3 3 0 01-3-3z"/><path d="M7 11c1.5-1 3-1.3 5-1.3s3.5.3 5 1.3"/><path d="M8.5 16h7"/>
{% elif key == 'jam' %}
  {# jam jar #}
  <rect x="6.5" y="3.5" width="11" height="3" rx="1"/><path d="M7 6.5h10l1 3v9a2 2 0 01-2 2H8a2 2 0 01-2-2v-9z"/><path d="M6.2 11.5h11.6"/><path d="M12 13.5c1.4 1.3 1.4 3 0 4-1.4-1-1.4-2.7 0-4z"/>
{% elif key == 'cakegel' %}
  {# sponge cake slice #}
  <path d="M3 17l9-11 9 11z"/><path d="M3 17v3h18v-3"/><path d="M5.5 14h13"/><circle cx="9.5" cy="11.5" r=".6"/><circle cx="13" cy="10" r=".6"/><circle cx="14.5" cy="13" r=".6"/>
{% elif key == 'topping' %}
  {# whipped cream swirl on cupcake #}
  <path d="M6 13h12l-1.5 7.5h-9z"/><path d="M5 13c0-2 1.6-3 3.2-3 .2-2 1.9-3.5 3.8-3.5s3.6 1.5 3.8 3.5c1.6 0 3.2 1 3.2 3"/><path d="M12 6.5c0-1.4.8-2.6 2-3"/><path d="M9.5 15v4M12 15v4M14.5 15v4"/>
{% elif key == 'ndc' %}
  {# coffee cup with steam #}
  <path d="M4.5 10h12v5.5a5 5 0 01-5 5h-2a5 5 0 01-5-5z"/><path d="M16.5 11.5h1.2a2.3 2.3 0 010 4.6h-1.5"/><path d="M8.5 3.5c-.8 1 .8 2 0 3M11.5 3.5c-.8 1 .8 2 0 3M14.5 3.5c-.8 1 .8 2 0 3"/>
{% elif key == 'soy' %}
  {# soybean pod #}
  <path d="M4 18.5C4 10 10.5 4 19.5 4 19.5 13 13.5 19.5 5 19.5z"/><circle cx="9.3" cy="14.4" r="1.6"/><circle cx="12.4" cy="11.4" r="1.6"/><circle cx="15.5" cy="8.4" r="1.6"/>
{% endif %}
</svg>
{% endmacro %}
